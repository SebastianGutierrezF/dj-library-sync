name: Release

# Tagging v* builds installers for macOS, Windows and Linux and attaches them
# to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Creating a release is a write. Workflow tokens default to read-only, and
    # without this every platform fails at the very end with
    # "Resource not accessible by integration" after a full build.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}

    # Secrets cannot be read directly in a step's `if`, so the decision is
    # hoisted here. Signing is all-or-nothing: a half-configured certificate
    # fails the build rather than producing an unsigned app.
    env:
      SIGN_MACOS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev

      - run: npm ci

      # Two near-identical steps rather than one with optional secrets: passing
      # an empty APPLE_CERTIFICATE makes tauri-action attempt a codesign and
      # fail on the import, instead of quietly building unsigned.
      - name: Build and release (signed)
        if: env.SIGN_MACOS == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DJ Library Sync ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Until the Apple secrets exist. macOS will report the download as
      # damaged; see docs/apple-setup.md.
      - name: Build and release (unsigned)
        if: env.SIGN_MACOS != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DJ Library Sync ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
